name: Android Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.build_type }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [ debug, release ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install bsdtar
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Download Xray-core binaries
        run: |
          set -eux

          ver="$(cat xray-version.txt)"

          dir=app/src/main/jniLibs/x86_64
          mkdir -p "$dir"
          url="https://github.com/XTLS/Xray-core/releases/download/v${ver}/Xray-android-amd64.zip"
          curl -fsSL "$url" | bsdtar -C "$dir" -x xray
          mv "${dir}/xray" "${dir}/libxray.so"
          chmod +x "${dir}/libxray.so"

          dir=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dir"
          url="https://github.com/XTLS/Xray-core/releases/download/v${ver}/Xray-android-arm64-v8a.zip"
          curl -fsSL "$url" | bsdtar -C "$dir" -x xray
          mv "${dir}/xray" "${dir}/libxray.so"
          chmod +x "${dir}/libxray.so"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.build_type }} APK
        run: |
          TASK="assemble$(echo "${{ matrix.build_type }}" | sed 's/./\U&/')"
          ./gradlew $TASK

      - name: Locate APKs
        id: locate
        run: |
          mkdir -p artifact-output
          find app/build/outputs/apk/${{ matrix.build_type }} \
            -type f \
            -name "*.apk" \
            -exec cp {} artifact-output/ \;

      - name: Upload arm64-v8a APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: wolfram-arm64-v8a-${{ matrix.build_type }}
          path: artifact-output/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload x86_64 APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: wolfram-x86_64-${{ matrix.build_type }}
          path: artifact-output/*x86_64*.apk
          if-no-files-found: error

