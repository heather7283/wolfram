name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.build_type }} (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
        abi: [arm64-v8a, x86_64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bsdtar
        run: sudo apt install -y libarchive-tools

      - name: Download Xray-core binary
        run: |
          set -eux

          abi=${{ matrix.abi }}
          case "$abi" in
          (x86_64) arch=amd64 ;;
          (*) arch="${abi}"
          esac
          ver="$(cat xray-version.txt)"
          url="https://github.com/XTLS/Xray-core/releases/download/v${ver}/Xray-android-${arch}.zip"

          mkdir -p "app/src/main/jniLibs/${abi}"
          cd "app/src/main/jniLibs/${abi}"
          curl -fsSL "$url" | bsdtar -x xray
          mv xray libxray.so
          chmod +x libxray.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.build_type }} APK for ${{ matrix.abi }}
        run: |
          TASK="assemble$(echo "${{ matrix.build_type }}" | sed 's/./\U&/')"
          ./gradlew $TASK -PabiFilters=${{ matrix.abi }}

      - name: Locate APKs
        id: locate
        run: |
          mkdir -p artifact-output
          find app/build/outputs/apk/${{ matrix.build_type }} \
            -type f \
            -name "*.apk" \
            -exec cp {} artifact-output/ \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.abi }}-${{ matrix.build_type }}
          path: artifact-output/*.apk
          if-no-files-found: error

